<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="No Human World">
<link rel="apple-touch-icon" href="./icon-192.svg">

<title>No Human World · Ciclo della Vita (NHW_new_v11)</title>
<style>
:root{
 --font-serif:"Cinzel",Georgia,"Times New Roman",serif;
 --font-sans:"Plus Jakarta Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
 --bg:#090d16;
 --panel:#111726;
 --card:#182034;
 --card2:#212c46;
 --border:#2d3b5c;
 --amber:#f59e0b;
 --amber2:#fbbf24;
 --teal:#10b981;
 --red:#ef4444;
 --blue:#3b82f6;
 --purple:#a855f7;
 --ash:#f97316;
 --furia:#b56576;
 --t:#f1f5f9;
 --m:#94a3b8;
 --die-bg:#faf8f5;
 --die-fg:#1e293b;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;max-width:100%}
html,body{overflow-x:hidden;width:100%}
body{
 background:radial-gradient(circle at 50% 22%,#141c33 0%,#090d16 68%,#06080f 100%);
 color:#F2F4FF;
 font:14px/1.42 var(--font-sans);
 padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));
 font-variant-numeric:tabular-nums;
 min-height:100vh;
}
body.no-motion *,body.no-motion *::before,body.no-motion *::after{animation:none!important;transition:none!important}
h1,h2,.brand,.city-hero b,.frame-hd span{font-family:var(--font-serif);letter-spacing:.03em}

header{position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--border);padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.98rem;color:var(--t)}
.brand .ico{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--purple),var(--amber));display:inline-flex;align-items:center;justify-content:center;color:#090d16;font-weight:900;font-size:.9rem;flex-shrink:0}
.brand small{font-weight:500;color:var(--m);font-size:.74rem}
.badges{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 9px;font-size:.76rem;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.pill.gold{border-color:#78350f;color:var(--amber2)}
.pill.essence{border-color:#581c87;color:#e9d5ff}
.pill.ash{border-color:#9a3412;color:#fed7aa}
.pill.teal{border-color:#065f46;color:#34d399}

#p{padding:8px 9px 18px;max-width:540px;margin:0 auto}

.qbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-bottom:9px}
.qbox-hd{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:.9rem}
.qbox-hd small{color:var(--m);font-weight:600;font-size:.74rem}

.furia-head-line{font-size:.86rem;font-weight:800;color:#e9d5ff;line-height:1.3;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.furia-dice-num{font-size:1.12rem;font-weight:900;color:#ef4444;line-height:1;display:inline-block;margin:0 2px}
.take-dice-cue{font-size:.86rem;font-weight:800;color:#e9d5ff;line-height:1.22;letter-spacing:.01em;display:block}

.cat-voice{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:9px;padding:8px 10px}

/* === STILE DADI QUADRATI E 25 FACCE === */
.dice{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0;max-width:100%}
.dice-row{display:flex;justify-content:center;gap:8px;width:100%}
.die{width:92px;max-width:30%;aspect-ratio:1/1;height:auto;border-radius:15px;background:var(--die-bg);color:var(--die-fg);border:5px solid #cbd5e1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;will-change:transform;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.22);padding:4px 2px}
.die-ico{display:flex;align-items:center;justify-content:center;height:40px;font-size:2.05rem}
.die small{font-size:.78rem;font-weight:800;margin-top:3px;letter-spacing:.01em;color:var(--die-fg);text-align:center;padding:0 2px}
.die.w{transform:scale(1.05)}
.die.rolling{animation:diceRoll .28s ease-out}
@keyframes diceRoll{0%{transform:scale(.82) rotate(-8deg);opacity:.65}60%{transform:scale(1.06) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0deg);opacity:1}}
.die.idle-slot{background:var(--card);border:2px dashed var(--border);color:var(--m);font-size:.76rem;font-weight:700;text-align:center;padding:4px;box-shadow:none;opacity:.62}

.dice-stage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%}
.dice-stage-row .dice{flex:1;min-width:0}
.roll-col{display:flex;flex-direction:column;align-items:center;gap:6px;width:118px;flex-shrink:0;text-align:center}
.cta-lancia{width:100px;height:100px;min-width:100px;min-height:100px;border-radius:50%;background:var(--amber2);color:#090d16;border:2px solid var(--amber);padding:6px;font-weight:900;font-size:.7rem;line-height:1.12;cursor:pointer;box-shadow:0 3px 0 #b45309,0 6px 14px rgba(245,158,11,.28);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.cta-lancia:active:not(:disabled){transform:translateY(2px)}
.cta-lancia:disabled{opacity:.48;cursor:default;box-shadow:none}

.roll-cd-box{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
.roll-cd-sec{font-size:.86rem;font-weight:900;color:var(--amber2);line-height:1.1}
.pbar{width:100%;height:6px;background:#090d16;border-radius:5px;overflow:hidden;border:1px solid var(--border);margin-top:2px}
.pbar u{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--amber2));transition:width .25s linear}

.combo-banner{border:1.5px solid #090d16;color:#090d16;border-radius:8px;padding:8px 10px;font-size:.85rem;font-weight:900;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.22)}

/* === RUOTA EVENTO SPECIALE === */
.wheel-stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 4px;background:var(--card);border:1px solid var(--border);border-radius:10px}
.wheel-wrap{position:relative;width:176px;height:176px;display:flex;align-items:center;justify-content:center}
.wheel-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;border-top:16px solid #ef4444;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.wheel-disc{width:164px;height:164px;border-radius:50%;border:4px solid #f8fafc;box-shadow:0 4px 16px rgba(0,0,0,.45);transition:transform 2.4s cubic-bezier(.15,.85,.22,1);position:relative;overflow:hidden;background:conic-gradient(
 #22a06b 0deg 60deg,
 #d4a017 60deg 120deg,
 #14919b 120deg 180deg,
 #2563eb 180deg 240deg,
 #d2b48c 240deg 300deg,
 #a855f7 300deg 360deg
)}
.wheel-hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:36px;height:36px;border-radius:50%;background:#090d16;border:2px solid #fbbf24;color:#fbbf24;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:.9rem;z-index:2}
.wheel-labels{position:absolute;inset:0;pointer-events:none}
.wheel-seg-ico{position:absolute;left:50%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:900;color:#090d16;text-shadow:0 1px 0 rgba(255,255,255,.55)}
.wheel-status{font-size:.82rem;font-weight:800;color:#fde68a;text-align:center}

@media(max-width:400px){
 .dice-stage-row{gap:6px}
 .roll-col{width:102px}
 .furia-head-line,.take-dice-cue{font-size:.76rem}
 .furia-dice-num{font-size:1rem}
 .cta-lancia{width:88px;height:88px;min-width:88px;min-height:88px;font-size:.64rem}
 .die{width:78px}
 .die-ico{height:34px;font-size:1.8rem}
}

.map-box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px}
.map-wrap{position:relative;border-radius:10px;overflow:hidden;border:2px solid #2b4570;background:#0b1f3a;box-shadow:0 8px 20px rgba(0,0,0,.45)}
#wb-map,#bio-map{width:100%;height:auto;display:block;touch-action:manipulation;cursor:pointer;image-rendering:crisp-edges}
.map-bar-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px solid var(--border);font-size:.82rem;color:var(--m)}
.map-sel-stacked{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.map-sel-stacked span{font-size:.78rem;color:#cbd5e1;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-sel-stacked b{color:var(--t);font-weight:800}

/* Mini-diario 3 righe */
.mini-diary-box{background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:10px;padding:8px 10px;margin-bottom:9px}
.mini-diary-box ul{list-style:none;font-size:.76rem;color:#cbd5e1}
.mini-diary-box li{padding:2px 0;border-bottom:1px dashed rgba(148,163,184,.2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-diary-box li:last-child{border-bottom:none}

.frame{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:10px}
.frame-hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-weight:800;font-size:.96rem;flex-wrap:wrap}
.banner{background:#1f1c14;border:1px solid #78350f;color:#fde68a;border-radius:8px;padding:8px 10px;font-size:.82rem;margin-bottom:10px}

/* Selettore rapido biomi nel pannello Biomi */
.biome-switcher{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:10px}
.biome-sw-btn{
 background:var(--card);color:var(--m);border:1px solid var(--border);border-radius:8px;
 padding:6px 3px;min-height:38px;font:inherit;font-size:.7rem;font-weight:800;cursor:pointer;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.biome-sw-btn.on{background:var(--amber);color:#090d16;border-color:var(--amber)}
.biome-sw-btn .dot-st{width:7px;height:7px;border-radius:50%;display:inline-block}

.city-hero{background:linear-gradient(135deg,rgba(24,32,52,.95) 0%,var(--card) 100%);border:1px solid var(--border);border-left:5px solid var(--cc);border-radius:10px;padding:10px;margin-bottom:10px}
.city-hero small{display:block;color:var(--t);font-size:.84rem;line-height:1.45}

/* Griglia a 5 colonne */
.species-cols{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.sp-col{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--cc);border-radius:9px;padding:5px 4px;display:flex;flex-direction:column;gap:5px;min-width:0}
.sp-col-hd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sp-col-hd b{font-size:.69rem;line-height:1.15;color:var(--t);word-break:break-word}
.ind-slot{background:var(--panel);border:2px solid var(--border);border-radius:6px;padding:5px 4px;display:flex;flex-direction:column;gap:4px;min-height:42px;justify-content:center}
.ind-slot.empty{opacity:.42;border-style:dashed;align-items:center}
.ind-slot.cucciolo{border-color:#22c55e;background:rgba(34,197,94,.12)}
.ind-slot.giovane{border-color:#38bdf8;background:rgba(56,189,248,.12)}
.ind-slot.adulto{border-color:#eab308;background:rgba(234,179,8,.12)}
.ind-slot.anziano{border-color:#f97316;background:rgba(249,115,22,.14)}
.ind-slot.morente{border-color:#ef4444;background:rgba(239,68,68,.18)}
.ind-top{display:flex;justify-content:center;align-items:center;font-size:.76rem;font-weight:900;line-height:1.1}
.ind-age{color:var(--t)}
.ind-bar{height:5px;background:#090d16;border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.ind-bar u{display:block;height:100%;transition:width .25s}
.ind-slot.cucciolo .ind-bar u{background:#22c55e}
.ind-slot.giovane .ind-bar u{background:#38bdf8}
.ind-slot.adulto .ind-bar u{background:#eab308}
.ind-slot.anziano .ind-bar u{background:#f97316}
.ind-slot.morente .ind-bar u{background:#ef4444}

@media(max-width:380px){
 .species-cols{gap:3px}
 .sp-col{padding:4px 2px}
 .sp-col-hd b{font-size:.62rem}
 .ind-top{font-size:.7rem}
}

/* Sviluppo (Semi d'Eco + Rituali di Cenere) */
.upg-sec-hd{font-size:.78rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;margin:10px 0 6px;display:flex;justify-content:space-between;align-items:center}
.upg-sec-hd.eco{color:#e9d5ff}
.upg-sec-hd.ash{color:#fed7aa}
.upg-list{display:flex;flex-direction:column;gap:8px}
.upg-row{background:var(--card);border:1px solid var(--border);border-left:4px solid var(--purple);border-radius:10px;padding:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.upg-row.ash-row{border-left-color:var(--ash)}
.upg-meta{flex:1;min-width:0}
.upg-meta b{font-size:.88rem;display:block}
.upg-meta small{display:block;color:var(--m);font-size:.75rem;margin-top:2px}
.upg-lvl{display:inline-block;margin-top:4px;font-size:.7rem;font-weight:800;color:#e9d5ff;background:rgba(168,85,247,.16);border:1px solid rgba(168,85,247,.38);padding:2px 7px;border-radius:999px}
.upg-row.ash-row .upg-lvl{color:#fed7aa;background:rgba(249,115,22,.16);border-color:rgba(249,115,22,.42)}
.upg-price-btn{background:var(--purple);color:#ffffff;border:1px solid #c084fc;border-radius:9px;padding:8px 11px;min-height:44px;min-width:98px;font:inherit;font-size:.8rem;font-weight:900;cursor:pointer;white-space:nowrap;text-align:center;flex-shrink:0}
.upg-price-btn.ash-btn{background:#ea580c;border-color:#fb923c}
.upg-price-btn:disabled{background:var(--card2);color:var(--m);border-color:var(--border);opacity:.5;cursor:default}

/* Pannello Guerre */
.war-subtabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.war-sub-btn{background:var(--card);color:var(--m);border:1px solid var(--border);border-radius:8px;padding:7px 8px;min-height:38px;font:inherit;font-size:.76rem;font-weight:800;cursor:pointer}
.war-sub-btn.on{background:var(--amber);color:#090d16;border-color:var(--amber)}
.war-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px;margin-bottom:9px}
.war-card-hd{display:flex;justify-content:space-between;font-size:.74rem;color:var(--m);margin-bottom:6px}
.war-visual{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin:6px 0 8px}
.war-bubble{background:var(--panel);border:2px solid var(--border);border-radius:12px;padding:8px 6px;text-align:center;font-weight:800;font-size:.8rem}
.war-bubble.atk{border-color:var(--red)}
.war-bubble.def{border-color:var(--blue)}
.war-arrows{text-align:center;font-size:.76rem;color:var(--amber2);font-weight:900;padding:0 3px}
.war-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:.74rem;background:var(--panel);padding:7px 8px;border-radius:8px}
.furia-war-note{margin-top:7px;font-size:.74rem;color:#f2a2b3;background:#231820;border-left:3px solid var(--furia);padding:5px 8px;border-radius:6px}

/* Stats a due colonne: Numeri e Diario */
.stats-two-col{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:start}
.stats-col{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:9px;min-width:0}
.stats-col-hd{font-family:var(--font-serif);font-size:.86rem;font-weight:800;color:var(--amber2);margin-bottom:8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.num-item{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 8px;margin-bottom:6px}
.num-item small{display:block;color:var(--m);font-size:.68rem}
.num-item b{display:block;font-size:.9rem;color:var(--t);margin-top:1px}
.diary-entry{border-left:3px solid var(--amber);padding:5px 7px;margin-bottom:6px;background:var(--card);border-radius:0 6px 6px 0;font-size:.74rem;line-height:1.32;word-break:break-word}
.diary-entry span{color:var(--amber2);font-weight:800;margin-right:3px}

@media(max-width:420px){
 .stats-two-col{gap:6px}
 .stats-col{padding:7px}
 .num-item b{font-size:.82rem}
 .diary-entry{font-size:.7rem;padding:4px 6px}
}

.btn,.mini{font:inherit;border:1px solid var(--border);background:var(--card2);color:var(--t);border-radius:8px;padding:7px 10px;min-height:44px;cursor:pointer;font-weight:700;font-size:.8rem;flex-shrink:0}
.btn.on,.mini.on{background:var(--amber);color:#090d16;border-color:var(--amber)}
.btn.big{width:100%;margin-top:6px;background:var(--amber);color:#090d16;font-weight:800;padding:11px}
.btn:disabled,.mini:disabled{opacity:.45;cursor:default}
.mini.help-opt-btn{background:var(--card2);color:var(--amber2);border-color:var(--amber);font-weight:900}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:6px 0}
.opt-section-lbl{font-size:.76rem;font-weight:800;color:var(--amber2);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
.dim{color:var(--m);font-size:.82rem}

textarea.sv-box{width:100%;min-height:66px;background:var(--bg);color:var(--t);border:1px solid var(--border);border-radius:8px;padding:7px;font-family:monospace;font-size:.74rem;margin-top:6px}

/* Barra inferiore a 5 pulsanti uguali */
#bottom-nav{
 position:fixed;left:0;right:0;bottom:0;z-index:40;
 display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:5px;
 background:rgba(17,23,38,.97);border-top:1px solid var(--border);
 padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.nav-btn{
 background:var(--card);color:var(--m);border:1px solid var(--border);border-radius:10px;
 padding:5px 2px;min-height:48px;font:inherit;font-size:.67rem;font-weight:800;
 cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.nav-btn.on{background:var(--amber);color:#090d16;border-color:var(--amber)}

#modal{display:none}
#modal.on{display:flex;position:fixed;inset:0;background:rgba(6,8,15,.78);align-items:center;justify-content:center;padding:14px;z-index:50}
#modal .mbox{background:var(--panel);border:1.5px solid var(--amber);border-radius:12px;padding:14px;max-width:440px;width:100%;max-height:82vh;overflow-y:auto}
.help-section{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:.8rem;line-height:1.4;color:var(--t)}
.help-section b{color:var(--amber2);display:block;margin-bottom:2px}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--amber);color:#090d16;font-weight:800;padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:92%;text-align:center}
#toast.on{opacity:1}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<header id="top-hdr">
 <div class="brand"><span class="ico">🌿</span><div><span id="tit">No Human World</span><br><small id="subtit"></small></div></div>
 <div class="badges">
 <span class="pill gold" id="bdg-f">💧 0 Linfa</span>
 <span class="pill essence" id="bdg-e">✨ 0</span>
 <span class="pill ash" id="bdg-c">🔥 0</span>
 <span class="pill teal" id="bdg-life">🐾 0/125</span>
 </div>
</header>
<div id="p"></div>
<div id="modal"></div>

/* ============================================================================
 * 2. AUDIO ENGINE (Lightweight procedural Web Audio API, zero external assets)
 * ============================================================================ */
var AUDIO={
 ctx:null,
 enabled:true,
 unlock:function(){
 if(!this.enabled)return;
 try{
 var AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 if(!this.ctx)this.ctx=new AC();
 if(this.ctx.state==="suspended")this.ctx.resume();
 }catch(e){}
 },
 tone:function(freq,dur,type,vol,delay){
 if(!this.enabled)return;
 this.unlock();
 if(!this.ctx)return;
 try{
 var now=this.ctx.currentTime+(delay||0);
 var osc=this.ctx.createOscillator();
 var gain=this.ctx.createGain();
 osc.type=type||"sine";
 osc.frequency.setValueAtTime(freq,now);
 gain.gain.setValueAtTime(Math.max(0.001,vol||0.04),now);
 gain.gain.exponentialRampToValueAtTime(0.0008,now+(dur||0.12));
 osc.connect(gain);
 gain.connect(this.ctx.destination);
 osc.start(now);
 osc.stop(now+(dur||0.12)+0.02);
 }catch(e){}
 },
 play:function(kind){
 if(!this.enabled)return;
 if(kind==="roll"){
 this.tone(240,0.06,"triangle",0.035,0);
 this.tone(320,0.07,"triangle",0.035,0.05);
 }else if(kind==="combo"){
 this.tone(440,0.11,"sine",0.045,0);
 this.tone(554,0.12,"sine",0.045,0.07);
 this.tone(659,0.16,"sine",0.05,0.14);
 }else if(kind==="wheel"){
 this.tone(392,0.08,"triangle",0.04,0);
 this.tone(523,0.08,"triangle",0.04,0.08);
 this.tone(659,0.10,"triangle",0.04,0.16);
 this.tone(784,0.18,"sine",0.05,0.24);
 }else if(kind==="war_def"){
 this.tone(330,0.12,"sine",0.045,0);
 this.tone(495,0.18,"sine",0.05,0.09);
 }else if(kind==="buy"){
 this.tone(520,0.08,"sine",0.04,0);
 this.tone(740,0.12,"sine",0.045,0.06);
 }
 }
};

/* ============================================================================
 * 3. PURE SIMULATION ENGINE (DOM-independent logic)
 * ============================================================================ */
var SIM={
 clamp:function(v,a,b){return v<a?a:(v>b?b:v);},

 nextRnd:function(st){
 st.rng=(st.rng+0x6D2B79F5)|0;
 var t=Math.imul(st.rng^(st.rng>>>15),1|st.rng);
 t=(t+Math.imul(t^(t>>>7),61|t))^t;
 return ((t^(t>>>14))>>>0)/4294967296;
 },

 getUpgLvl:function(st,id){
 return (st.upgrades&&st.upgrades[id])||0;
 },

 getUpgCost:function(def,lvl){
 return Math.round(def.baseCost*Math.pow(def.mult,lvl));
 },

 getLancioIntervalSec:function(st){
 return Math.max(5,CONFIG.REGOLE.lancioSec-this.getUpgLvl(st,"richiamo_dadi"));
 },

 getManualRollCost:function(st){
 var disc=1-0.10*this.getUpgLvl(st,"mano_lesta");
 return Math.max(150,Math.round(CONFIG.REGOLE.forzaBaseCosto*this.clamp(disc,0.4,1)));
 },

 getBirthCostForIndividual:function(st,valoreSpecie,cuccioliStessaSpecie,cuccioliAltreSpecieBioma){
 var baseCost=100*this.clamp(valoreSpecie,1,5);
 var mult=1+(0.50*cuccioliStessaSpecie)+(0.12*cuccioliAltreSpecieBioma);
 var ashDisc=1-0.07*this.getUpgLvl(st,"seme_ardente");
 return Math.max(30,Math.round(baseCost*mult*this.clamp(ashDisc,0.5,1)));
 },

 getFaseFromEta:function(eta){
 if(eta>=90)return "morente";
 if(eta>=60)return "anziano";
 if(eta>=20)return "adulto";
 if(eta>=10)return "giovane";
 return "cucciolo";
 },

 getIndividualMaxHp:function(ind,valoreSpecie){
 var val=this.clamp(Number(valoreSpecie)||1,1,5);
 var cap=(ind&&ind.isHero)?CONFIG.REGOLE.maxHpHero:CONFIG.REGOLE.maxHpNormal;
 var fase=(ind&&ind.fase)||"cucciolo";
 var mult=fase==="adulto"?22:(fase==="anziano"?18:(fase==="giovane"?16:12));
 var base=val*mult+(ind&&ind.isHero?60:0);
 return this.clamp(Math.round(base),1,cap);
 },

 getIndividualForce:function(ind,valoreSpecie,biomeDebuffActive){
 var val=this.clamp(Number(valoreSpecie)||1,1,5);
 var fase=(ind&&ind.fase)||"cucciolo";
 var mult=fase==="adulto"?4:(fase==="giovane"?2:(fase==="anziano"?1.5:1));
 var f=val*mult+(ind&&ind.isHero?6:0);
 if(biomeDebuffActive)f*=0.85;
 return Math.max(1,Math.round(f));
 },

 syncIndividualCombatStats:function(ind,valoreSpecie,preserveRatio){
 var prevMax=ind.maxHp||this.getIndividualMaxHp(ind,valoreSpecie);
 var prevHp=(typeof ind.hp==="number")?ind.hp:prevMax;
 var ratio=preserveRatio&&prevMax>0?(prevHp/prevMax):1;
 var nextMax=this.getIndividualMaxHp(ind,valoreSpecie);
 ind.maxHp=nextMax;
 if(preserveRatio){
 ind.hp=this.clamp(Math.ceil(nextMax*ratio),1,nextMax);
 }else{
 ind.hp=nextMax;
 }
 ind.forza=this.getIndividualForce(ind,valoreSpecie,false);
 },

 makeIndividual:function(spId,num,valoreSpecie){
 var ind={id:spId+"_"+num,eta:0,fase:"cucciolo",isHero:false,isKing:false,hp:1,maxHp:1,forza:1};
 this.syncIndividualCombatStats(ind,valoreSpecie||1,false);
 return ind;
 },

 ensureBiomeKingdomFields:function(st,bIdx){
 var B=st.biomi[bIdx];
 if(!B)return;
 if(typeof B.kingId==="undefined")B.kingId=null;
 if(typeof B.anarchyRemainingSec!=="number")B.anarchyRemainingSec=0;
 if(typeof B.electionCooldownSec!=="number")B.electionCooldownSec=0;
 if(typeof B.pendingSuccessionCheck!=="boolean")B.pendingSuccessionCheck=false;
 },

 findKingInBiome:function(st,bIdx){
 var B=st.biomi[bIdx];
 if(!B)return null;
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 if(inds[i].isKing || (B.kingId && inds[i].id===B.kingId)){
 inds[i].isKing=true;
 B.kingId=inds[i].id;
 return {ind:inds[i],k:k,idx:i};
 }
 }
 }
 B.kingId=null;
 return null;
 },

 findEldestEligibleAdultInBiome:function(st,bIdx){
 var B=st.biomi[bIdx];
 if(!B)return null;
 var best=null;
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 var ind=inds[i];
 if(ind.fase==="adulto" && !ind.isHero && !ind.isSuperHero){
 if(!best || (ind.eta||0)>(best.ind.eta||0)){
 best={ind:ind,k:k,idx:i};
 }
 }
 }
 }
 return best;
 },

 isBiomeInWar:function(st,bIdx){
 var wars=st.guerre||[];
 for(var i=0;i<wars.length;i++){
 if(wars[i].active && (wars[i].atkIdx===bIdx || wars[i].defIdx===bIdx))return true;
 }
 return false;
 },

 handleKingDeath:function(st,bIdx,reasonIt,reasonEn,deferAnarchyUntilWarEnd){
 this.ensureBiomeKingdomFields(st,bIdx);
 var B=st.biomi[bIdx],meta=CONFIG.BIOMI[bIdx];
 if(!B||!meta)return;
 B.kingId=null;
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++)inds[i].isKing=false;
 }
 var heir=this.findEldestEligibleAdultInBiome(st,bIdx);
 if(heir){
 heir.ind.isKing=true;
 B.kingId=heir.ind.id;
 B.anarchyRemainingSec=0;
 B.pendingSuccessionCheck=false;
 var spIt=meta.animali[heir.k],spEn=meta.animaliEn[heir.k];
 this.addLog(
 st,
 meta.it.N+": "+reasonIt+". Sale al trono "+spIt+" adulto più anziano ("+Math.floor(heir.ind.eta)+" anni).",
 meta.en.N+": "+reasonEn+". Eldest adult "+spEn+" ("+Math.floor(heir.ind.eta)+" yrs) takes the throne.",
 true
 );
 return;
 }
 if(deferAnarchyUntilWarEnd){
 B.pendingSuccessionCheck=true;
 this.addLog(
 st,
 meta.it.N+": "+reasonIt+" senza eredi adulti idonei; l'anarchia scatterà alla chiusura della guerra.",
 meta.en.N+": "+reasonEn+" with no eligible adult heirs; anarchy will begin once the war ends.",
 true
 );
 }else{
 B.pendingSuccessionCheck=false;
 if((B.anarchyRemainingSec||0)<=0){
 B.anarchyRemainingSec=CONFIG.REGOLE.anarchyDurationYears*CONFIG.REGOLE.secPerAnno;
 this.addLog(
 st,
 meta.it.N+": "+reasonIt+" senza eredi adulti idonei! Iniziano "+CONFIG.REGOLE.anarchyDurationYears+" anni di anarchia.",
 meta.en.N+": "+reasonEn+" with no eligible adult heirs! "+CONFIG.REGOLE.anarchyDurationYears+" years of anarchy begin.",
 true
 );
 }
 }
 },

 canElectKingInBiome:function(st,bIdx){
 this.ensureBiomeKingdomFields(st,bIdx);
 var B=st.biomi[bIdx];
 if(!B||!B.sbloccato)return false;
 if((B.electionCooldownSec||0)>0)return false;
 return !!this.findEldestEligibleAdultInBiome(st,bIdx);
 },

 electKingInBiome:function(st,bIdx){
 if(!this.canElectKingInBiome(st,bIdx))return false;
 var B=st.biomi[bIdx],meta=CONFIG.BIOMI[bIdx];
 var candidate=this.findEldestEligibleAdultInBiome(st,bIdx);
 if(!candidate)return false;
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++)inds[i].isKing=false;
 }
 candidate.ind.isKing=true;
 B.kingId=candidate.ind.id;
 var wasAnarchy=(B.anarchyRemainingSec||0)>0;
 B.anarchyRemainingSec=0;
 B.pendingSuccessionCheck=false;
 B.electionCooldownSec=CONFIG.REGOLE.electionCooldownYears*CONFIG.REGOLE.secPerAnno;
 var spIt=meta.animali[candidate.k],spEn=meta.animaliEn[candidate.k];
 this.addLog(
 st,
 meta.it.N+": elezione sovrana! "+spIt+" ("+Math.floor(candidate.ind.eta)+" anni) diventa Re"+(wasAnarchy?" interrompendo l'anarchia":"" )+".",
 meta.en.N+": royal election! "+spEn+" ("+Math.floor(candidate.ind.eta)+" yrs) becomes King"+(wasAnarchy?" ending anarchy":"" )+".",
 true
 );
 return true;
 },

 addLog:function(st,itMsg,enMsg,priority){
 st.logCounter=(st.logCounter||0)+1;
 if(!priority && (st.logCounter%2===1))return;
 st.diario.unshift({t:Math.floor(st.t),it:itMsg,en:enMsg});
 if(st.diario.length>40)st.diario.pop();
 },

 countCuccioliInSpecies:function(sp){
 var c=0,inds=sp.individui||[];
 for(var i=0;i<inds.length;i++)if(inds[i].fase==="cucciolo")c++;
 return c;
 },

 contaIndividuiVivi:function(st){
 var c=0;
 for(var b=0;b<st.biomi.length;b++){
 for(var k=0;k<5;k++)c+=(st.biomi[b].specie[k].individui||[]).length;
 }
 return c;
 },

 contaBiomiVivi:function(st){
 var c=0;
 for(var b=0;b<st.biomi.length;b++)if(st.biomi[b].sbloccato)c++;
 return c;
 },

 getBiomeLivingStats:function(st,bIdx){
 var B=st.biomi[bIdx];
 if(!B)return {count:0,avgAge:0,adults:0};
 var count=0,sumAge=0,adults=0;
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 count++;
 sumAge+=(inds[i].eta||0);
 if(inds[i].fase==="adulto")adults++;
 }
 }
 return {
 count:count,
 avgAge:count>0?Math.round((sumAge/count)*10)/10:0,
 adults:adults
 };
 },

 getBiomeForce:function(st,bIdx){
 var B=st.biomi[bIdx];
 if(!B)return 0;
 var force=0;
 for(var k=0;k<5;k++){
 var val=(k+1);
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 var f=inds[i].fase;
 if(f==="adulto")force+=4*val;
 else if(f==="giovane")force+=2*val;
 else if(f==="anziano")force+=1.5*val;
 }
 }
 if((B.forceDebuffTicks||0)>0)force*=0.85;
 return Math.round(force);
 },

 for(var k=0;k<5;k++){

 for(var i=0;i<inds.length;i++){

 if(includeAll || f==="adulto" || f==="giovane" || f==="anziano"){

 }
 return cnt>0?(sum/cnt):1;

 getWarHitChance:function(st,atkIdx,defIdx){

 var defRar=this.getBiomeRarityAvg(st,defIdx,true)*0.02;
 var shieldBonus=0.01*this.getUpgLvl(st,"scudo_bioma");
 var raw=CONFIG.REGOLE.baseHitChance+atkRar-(defRar+CONFIG.REGOLE.defenderBonus+shieldBonus);

 },

 getSpeciesDiceAffinity:function(st,bIdx,kIdx){

 },

 processAutonomousBirths:function(st){
 var bornCount=0;
 if(!st.diceAffinity)st.diceAffinity={};
 var startCursor=(st.birthCursor||0)%5;
 var progress=true;
 while(progress){
  progress=false;
  /* Raccoglie coppie (bioma, specie) con slot liberi, dando priorità all'affinità dei dadi
     e bilanciando la popolazione tra i biomi */
  var candidates=[];
  for(var b=0;b<5;b++){
   var stB=SIM.getBiomeLivingStats(st,b);
   for(var k=0;k<5;k++){
    var sp=st.biomi[b].specie[k];
    var cap=this.getSpeciesMaxSlots(st,b,k);
    if((sp.individui||[]).length<cap){
     var aff=this.getSpeciesDiceAffinity(st,b,k);
     candidates.push({b:b,k:k,aff:aff,bCount:stB.count,val:(k+1)});
    }
   }
  }
  candidates.sort(function(x,y){
   if(y.aff!==x.aff)return y.aff-x.aff;
   if(x.bCount!==y.bCount)return x.bCount-y.bCount;
   if(x.val!==y.val)return x.val-y.val;
   var r1=(x.b-startCursor+5)%5;
   var r2=(y.b-startCursor+5)%5;
   return r1-r2;
  });

  for(var ci=0;ci<candidates.length;ci++){
   var cand=candidates[ci];
   var b2=cand.b,k2=cand.k;
   var B2=st.biomi[b2],meta2=CONFIG.BIOMI[b2],sp2=B2.specie[k2];
   var val2=sp2.valore||(k2+1);
   var cuccSpecie=this.countCuccioliInSpecies(sp2);
   var cuccAltriBioma=0;
   for(var j=0;j<5;j++)if(j!==k2)cuccAltriBioma+=this.countCuccioliInSpecies(B2.specie[j]);
   var baseCost=this.getBirthCostForIndividual(st,val2,cuccSpecie,cuccAltriBioma);
   var affDisc=this.clamp(1-0.12*cand.aff,0.35,1);
   var cost=Math.max(25,Math.round(baseCost*affDisc));
   if(st.linfa>=cost){
    st.linfa-=cost;
    st.stats.nascite++;
    bornCount++;
    progress=true;
    var key2=b2+"_"+k2;
    if((st.diceAffinity[key2]||0)>0)st.diceAffinity[key2]=Math.max(0,st.diceAffinity[key2]-1);
    sp2.individui.push(this.makeIndividual(meta2.animali[k2],st.stats.nascite,val2));
    if(!B2.sbloccato){
     B2.sbloccato=true;
     this.addLog(st,meta2.it.N+" ha preso vita con il primo cucciolo di "+meta2.animali[k2]+"!",meta2.en.N+" came to life with the first "+meta2.animaliEn[k2]+" cub!",true);
    }else{
     this.addLog(st,meta2.it.N+": nuovo cucciolo di "+meta2.animali[k2]+" nato.",meta2.en.N+": new "+meta2.animaliEn[k2]+" cub born.",false);
    }
    break;
   }
  }
 }
 st.birthCursor=(startCursor+1)%5;
 return bornCount;
 },

 aggiornaTemperamentoFuria:function(st){
 var prevIdx=st.temperamentoIdx||0;
 var nextIdx=Math.floor(this.nextRnd(st)*CONFIG.FURIA_TEMPERAMENTS.length);
 st.temperamentoIdx=nextIdx;
 if(nextIdx!==prevIdx){

 }
 },

 scegliNumeroDadiFuria:function(st){
 var tObj=CONFIG.FURIA_TEMPERAMENTS[st.temperamentoIdx||0]||CONFIG.FURIA_TEMPERAMENTS[1];
 var boost=this.clamp(0.04*this.getUpgLvl(st,"stimolo_furia"),0,0.22);
 var w=tObj.weights.slice();
 w[0]=Math.max(0.04,w[0]-boost*0.45);
 w[1]=Math.max(0.06,w[1]-boost*0.35);
 w[3]=w[3]+boost*0.40;
 w[4]=w[4]+boost*0.40;

 var tot=0;
 for(var i=0;i<w.length;i++)tot+=w[i];
 var r=this.nextRnd(st)*tot;
 var acc=0;
 for(var k=0;k<w.length;k++){
 acc+=w[k];
 if(r<=acc)return k+1;
 }
 return 3;
 },

 avanzaCicloVita:function(st,dtSec){
 var deltaEta=(dtSec/CONFIG.REGOLE.secPerAnno);
 var semiPerCiclo=1+this.getUpgLvl(st,"eco_ciclo");

 for(var b=0;b<st.biomi.length;b++){
 this.ensureBiomeKingdomFields(st,b);
 var B=st.biomi[b],meta=CONFIG.BIOMI[b];
 if((B.anarchyRemainingSec||0)>0){
 B.anarchyRemainingSec=Math.max(0,B.anarchyRemainingSec-dtSec);
 if(B.anarchyRemainingSec===0){
 this.addLog(st,meta.it.N+": i 25 anni di anarchia sono terminati; il bioma entra in pace senza Re.",meta.en.N+": the 25 years of anarchy have ended; the biome enters peace without a King.",true);
 }
 }
 if((B.electionCooldownSec||0)>0){
 B.electionCooldownSec=Math.max(0,B.electionCooldownSec-dtSec);
 }
 if(!B.sbloccato)continue;
 var kingDiedNaturally=false;
 var kingSpeciesIt="",kingSpeciesEn="";
 for(var k=0;k<5;k++){
 var sp=B.specie[k];
 var valSp=sp.valore||(k+1);
 var nomeIt=meta.animali[k],nomeEn=meta.animaliEn[k];
 var nextList=[];

 for(var i=0;i<(sp.individui||[]).length;i++){
 var ind=sp.individui[i];
 var prevFase=ind.fase;
 ind.eta=Math.min(100,ind.eta+deltaEta);

 if(ind.eta>=100){
 sp.cicliCompiuti=(sp.cicliCompiuti||0)+1;
 st.stats.mortiCiclo++;
 st.semi=(st.semi||0)+semiPerCiclo;
 st.semiTotali=(st.semiTotali||0)+semiPerCiclo;
 st.cenere=(st.cenere||0)+1;
 st.cenereTotale=(st.cenereTotale||0)+1;
 if(ind.isKing || (B.kingId && ind.id===B.kingId)){
 kingDiedNaturally=true;
 kingSpeciesIt=nomeIt;
 kingSpeciesEn=nomeEn;
 }
 this.addLog(st,meta.it.N+": "+nomeIt+" ha chiuso il ciclo (+"+semiPerCiclo+" Semi d'Eco, +1 Cenere).",meta.en.N+": "+nomeEn+" completed its cycle (+"+semiPerCiclo+" Echo Seeds, +1 Ash).",true);
 continue;
 }

 ind.fase=this.getFaseFromEta(ind.eta);
 if(ind.fase!==prevFase){
 this.syncIndividualCombatStats(ind,valSp,true);
 if(ind.fase==="adulto")st.stats.evoluzioni++;
 if(ind.fase==="morente"){
 this.addLog(st,meta.it.N+": "+nomeIt+" è entrato negli ultimi anni.",meta.en.N+": "+nomeEn+" entered its final years.",false);
 }
 }else if(typeof ind.hp!=="number"){
 this.syncIndividualCombatStats(ind,valSp,false);
 }
 nextList.push(ind);
 }
 sp.individui=nextList;
 }
 if(kingDiedNaturally){
 this.handleKingDeath(
 st,
 b,
 "il Re ("+kingSpeciesIt+") ha concluso il suo ciclo vitale",
 "the King ("+kingSpeciesEn+") completed its life cycle",
 this.isBiomeInWar(st,b)
 );
 }
 }
 },

 pickRandomAttackerAdult:function(st,atkIdx){
 var B=st.biomi[atkIdx];
 if(!B)return null;
 var pool=[];
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 if(inds[i].fase==="adulto"){
 pool.push({ind:inds[i],k:k,idx:i,val:B.specie[k].valore||(k+1)});
 }
 }
 }
 if(pool.length===0)return null;
 return pool[Math.floor(this.nextRnd(st)*pool.length)];
 },

 pickRandomDefenderByPriority:function(st,defIdx){
 var B=st.biomi[defIdx];
 if(!B)return null;
 var prio=["adulto","anziano","giovane","morente","cucciolo"];
 for(var p=0;p<prio.length;p++){
 var targetFase=prio[p];
 var pool=[];
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 if(inds[i].fase===targetFase){

 }
 }
 }
 if(pool.length>0){

 }

 return null;
 },

 applyPostWarSurvivorHeal:function(st,bIdx){
 var B=st.biomi[bIdx];
 if(!B)return;
 for(var k=0;k<5;k++){
 var val=B.specie[k].valore||(k+1);
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 var ind=inds[i];
 var cap=ind.isHero?CONFIG.REGOLE.maxHpHero:CONFIG.REGOLE.maxHpNormal;
 if(typeof ind.hp!=="number")this.syncIndividualCombatStats(ind,val,false);
 var bonus=Math.ceil((ind.hp||1)*0.10);
 var maxAllowed=Math.min(cap,ind.maxHp||cap);

 }

 },

 finalizeBiomeWarSuccession:function(st,bIdx){
 this.ensureBiomeKingdomFields(st,bIdx);
 var B=st.biomi[bIdx],meta=CONFIG.BIOMI[bIdx];
 if(!B||!meta)return;

 var heir=this.findEldestEligibleAdultInBiome(st,bIdx);

 true
 );

 },

 removeOneByPhase:function(st,bIdx,targetFase){
 var B=st.biomi[bIdx];
 if(!B)return false;
 var pool=[];
 for(var k=0;k<5;k++){
 var inds=B.specie[k].individui||[];
 for(var i=0;i<inds.length;i++){
 if(inds[i].fase===targetFase)pool.push({k:k,idx:i,ind:inds[i]});
 }
 }
 if(pool.length===0)return false;
 var pick=pool[Math.floor(this.nextRnd(st)*pool.length)];
 var wasKing=pick.ind.isKing || (B.kingId && pick.ind.id===B.kingId);
 B.specie[pick.k].individui.splice(pick.idx,1);
 if(wasKing){
 this.handleKingDeath(st,bIdx,"il Re è caduto","the King has fallen",this.isBiomeInWar(st,bIdx));
 }

 },

 applyFuriaWarWheel:function(st,atkIdx,multiplier,wonWars){
 var B=st.biomi[atkIdx],meta=CONFIG.BIOMI[atkIdx];
 if(!B||!meta)return;
 var slice=CONFIG.FURIA_WAR_SLICES[Math.floor(this.nextRnd(st)*CONFIG.FURIA_WAR_SLICES.length)];
 var gritMult=this.clamp(1-0.12*this.getUpgLvl(st,"tempra_guerriera"),0.35,1);
 var effVal=slice.type==="fatigue"||slice.type==="force_debuff"
 ?Math.max(3,Math.round(slice.value*multiplier*gritMult))
 :(slice.value*multiplier);
 var descIt="",descEn="";

 if(slice.type==="fatigue"){
 B.fatigueRemaining=(B.fatigueRemaining||0)+effVal;
 descIt="+"+effVal+" tick di stanchezza di guerra";
 descEn="+"+effVal+" war fatigue ticks";
 }else if(slice.type==="lose_young"){
 var removedY=0;
 for(var r1=0;r1<effVal;r1++)if(this.removeOneByPhase(st,atkIdx,"giovane"))removedY++;
 descIt="perde "+removedY+" giovane/i";
 descEn="loses "+removedY+" young";
 }else if(slice.type==="lose_elder"){
 var removedE=0;
 for(var r2=0;r2<effVal;r2++)if(this.removeOneByPhase(st,atkIdx,"anziano"))removedE++;
 descIt="perde "+removedE+" anziano/i";
 descEn="loses "+removedE+" elder(s)";
 }else if(slice.type==="force_debuff"){
 B.forceDebuffTicks=(B.forceDebuffTicks||0)+effVal;
 descIt="-15% forza per "+effVal+" tick";
 descEn="-15% force for "+effVal+" ticks";
 }

 var multStr=multiplier>1?" (x2)":"";
 st.lastFuriaWarNote={
 it:"Ruota di Furia su "+meta.it.N+multStr+": "+slice.it+" → "+descIt+".",
 en:"Furia's Wheel on "+meta.en.N+multStr+": "+slice.en+" → "+descEn+"."
 };
 this.addLog(st,st.lastFuriaWarNote.it,st.lastFuriaWarNote.en,true);

 for(var w=0;w<wonWars.length;w++){
 wonWars[w].furiaIt=slice.it+multStr+" → "+descIt;
 wonWars[w].furiaEn=slice.en+multStr+" → "+descEn;
 }
 },

 trimConcludedWars:function(st){
 if(!st.guerre)return;
 var active=[],concluded=[];
 for(var i=0;i<st.guerre.length;i++){
 if(st.guerre[i].active)active.push(st.guerre[i]);
 else concluded.push(st.guerre[i]);
 }
 if(concluded.length>CONFIG.REGOLE.maxConcludedWarsShown){
 concluded=concluded.slice(concluded.length-CONFIG.REGOLE.maxConcludedWarsShown);
 }
 st.guerre=concluded.concat(active);
 },

 initiateAutonomousWars:function(st){
 if(!st.guerre)st.guerre=[];
 for(var a=0;a<CONFIG.BIOMI.length;a++){
 var B=st.biomi[a];
 if(!B||!B.sbloccato||(B.fatigueRemaining||0)>0)continue;

 /* Attacco sequenziale: un bioma apre un solo scontro attivo alla volta */
 var alreadyAtk=false;
 for(var w=0;w<st.guerre.length;w++){
 if(st.guerre[w].active && st.guerre[w].atkIdx===a){alreadyAtk=true;break;}
 }
 if(alreadyAtk)continue;

 /* Requisiti verificati prima di aprire il prossimo scontro della catena */
 var statsA=this.getBiomeLivingStats(st,a);
 if(statsA.count<CONFIG.REGOLE.minSlotAttacco || statsA.adults<CONFIG.REGOLE.minAdultiAttacco)continue;

 var forceA=this.getBiomeForce(st,a);
 if(forceA<=0)continue;

 /* Sceglie il primo difensore valido in ordine sequenziale (con >=4 adulti e forza <= attaccante) */
 var chosenDef=-1,chosenForceD=0,chosenStatsD=null;
 for(var d=0;d<CONFIG.BIOMI.length;d++){
 if(d===a)continue;
 var statsD=this.getBiomeLivingStats(st,d);
 var forceD=this.getBiomeForce(st,d);
 if(statsD.adults>=CONFIG.REGOLE.minAdultiDifesa && forceD<=forceA){
 chosenDef=d;
 chosenForceD=forceD;
 chosenStatsD=statsD;
 break;
 }
 }
 if(chosenDef<0)continue;

 var alloc=Math.max(1,Math.min(forceA,Math.max(chosenForceD,Math.round(forceA*0.5))));
 st.guerre.push({
 id:"w_"+Math.floor(st.t)+"_"+a+"_"+chosenDef,
 atkIdx:a,
 defIdx:chosenDef,
 allocatedForce:Math.round(alloc),
 startAtkAdults:statsA.adults,
 startDefAdults:chosenStatsD.adults,
 endAtkAdults:null,
 endDefAdults:null,
 enemyKills:0,
 ownAdultLosses:0,
 ticksElapsed:0,
 cenereGained:0,
 winnerIt:"",
 winnerEn:"",
 furiaIt:"",
 furiaEn:"",
 active:true
 });
 this.addLog(
 st,
 CONFIG.BIOMI[a].it.N+" avvia scontro sequenziale contro "+CONFIG.BIOMI[chosenDef].it.N+" (forza "+Math.round(alloc)+").",
 CONFIG.BIOMI[a].en.N+" starts sequential clash against "+CONFIG.BIOMI[chosenDef].en.N+" (force "+Math.round(alloc)+").",
 true
 );
 }
 },

 concludeWar:function(st,w,attackerWinsThisTick,defWinFlag){
 w.active=false;
 var endA=this.getBiomeLivingStats(st,w.atkIdx);
 var endD=this.getBiomeLivingStats(st,w.defIdx);
 w.endAtkAdults=endA.adults;
 w.endDefAdults=endD.adults;

 /* Bonus +10% Salute attuale (Math.ceil) applicato una sola volta ai superstiti */
 this.applyPostWarSurvivorHeal(st,w.atkIdx);
 this.applyPostWarSurvivorHeal(st,w.defIdx);

 if(endD.count===0 || endA.adults>endD.adults){
 st.stats.guerreVinteAtk=(st.stats.guerreVinteAtk||0)+1;
 w.cenereGained=0;
 w.winnerIt=CONFIG.BIOMI[w.atkIdx].it.N;
 w.winnerEn=CONFIG.BIOMI[w.atkIdx].en.N;
 attackerWinsThisTick.push(w);
 var endReasonIt=endD.count===0?"sterminio totale del difensore":"ritirata dell'ultimo adulto attaccante";
 var endReasonEn=endD.count===0?"total annihilation of defender":"retreat of last attacking adult";
 this.addLog(st,CONFIG.BIOMI[w.atkIdx].it.N+" chiude lo scontro contro "+CONFIG.BIOMI[w.defIdx].it.N+" ("+endReasonIt+").",CONFIG.BIOMI[w.atkIdx].en.N+" concludes clash against "+CONFIG.BIOMI[w.defIdx].en.N+" ("+endReasonEn+").",true);
 }else{
 var ashPrize=35+w.enemyKills*6;
 st.cenere=(st.cenere||0)+ashPrize;
 st.cenereTotale=(st.cenereTotale||0)+ashPrize;
 st.stats.guerreVinteDif=(st.stats.guerreVinteDif||0)+1;
 w.cenereGained=ashPrize;
 w.winnerIt=CONFIG.BIOMI[w.defIdx].it.N;
 w.winnerEn=CONFIG.BIOMI[w.defIdx].en.N;
 w.furiaIt="Nessuna punizione (attaccante ritirato a 1 adulto).";
 w.furiaEn="No punishment (attacker retreated at 1 adult).";
 defWinFlag.triggered=true;
 this.addLog(st,CONFIG.BIOMI[w.defIdx].it.N+" respinge "+CONFIG.BIOMI[w.atkIdx].it.N+" (+"+ashPrize+" Cenere).",CONFIG.BIOMI[w.defIdx].en.N+" repels "+CONFIG.BIOMI[w.atkIdx].en.N+" (+"+ashPrize+" Ash).",true);
 }

 this.finalizeBiomeWarSuccession(st,w.atkIdx);
 this.finalizeBiomeWarSuccession(st,w.defIdx);
 },

 stepWarsTick:function(st,isOffline){
 if(!st.guerre)st.guerre=[];
 var attackerWinsThisTick=[];
 var anyConcluded=false;
 var defWinFlag={triggered:false};

 for(var i=0;i<st.guerre.length;i++){
 var w=st.guerre[i];
 if(!w.active)continue;
 var stA=this.getBiomeLivingStats(st,w.atkIdx);
 var stD=this.getBiomeLivingStats(st,w.defIdx);

 /* Verifica preventiva di fine guerra (difensore azzerato o attaccante ridotto a <=1 adulto) */
 if(stD.count===0){
 this.concludeWar(st,w,attackerWinsThisTick,defWinFlag);
 anyConcluded=true;
 continue;
 }
 if(stA.adults<=1){
 /* Contrattacco finale del difensore prima della chiusura se ha ancora animali vivi */
 var lastDef=this.pickRandomDefenderByPriority(st,w.defIdx);
 var lastAtk=this.pickRandomAttackerAdult(st,w.atkIdx);
 if(lastDef && lastAtk){
 var defDebuff0=(st.biomi[w.defIdx].forceDebuffTicks||0)>0;
 var fDef0=this.getIndividualForce(lastDef.ind,lastDef.val,defDebuff0);
 var dmg0=Math.ceil(fDef0*0.5);
 lastAtk.ind.hp=(lastAtk.ind.hp||lastAtk.ind.maxHp||1)-dmg0;
 if(lastAtk.ind.hp<=0){
 var atkWasKing0=lastAtk.ind.isKing||(st.biomi[w.atkIdx].kingId&&lastAtk.ind.id===st.biomi[w.atkIdx].kingId);
 st.biomi[w.atkIdx].specie[lastAtk.k].individui.splice(lastAtk.idx,1);
 w.ownAdultLosses++;
 if(atkWasKing0)this.handleKingDeath(st,w.atkIdx,"il Re attaccante è caduto nel contrattacco finale","the attacking King fell in the final counter-attack",true);
 }
 }
 this.concludeWar(st,w,attackerWinsThisTick,defWinFlag);
 anyConcluded=true;
 continue;
 }

 w.ticksElapsed++;
 var atkFighter=this.pickRandomAttackerAdult(st,w.atkIdx);
 var defFighter=this.pickRandomDefenderByPriority(st,w.defIdx);
 if(!atkFighter || !defFighter){
 this.concludeWar(st,w,attackerWinsThisTick,defWinFlag);
 anyConcluded=true;
 continue;
 }

 var atkDebuff=(st.biomi[w.atkIdx].forceDebuffTicks||0)>0;
 var defDebuff=(st.biomi[w.defIdx].forceDebuffTicks||0)>0;

 /* 1. Colpo dell'attaccante (adulto) verso difensore (priorità fasce) */
 var fAtk=this.getIndividualForce(atkFighter.ind,atkFighter.val,atkDebuff);
 var dmgToDef=Math.ceil(fAtk*0.5);
 if(typeof defFighter.ind.hp!=="number")this.syncIndividualCombatStats(defFighter.ind,defFighter.val,false);
 defFighter.ind.hp-=dmgToDef;

 var defSurvived=true;
 if(defFighter.ind.hp<=0){
 defSurvived=false;
 var defWasKing=defFighter.ind.isKing||(st.biomi[w.defIdx].kingId&&defFighter.ind.id===st.biomi[w.defIdx].kingId);
 st.biomi[w.defIdx].specie[defFighter.k].individui.splice(defFighter.idx,1);
 w.enemyKills++;
 if(defWasKing){
 this.handleKingDeath(st,w.defIdx,"il Re difensore è caduto in guerra","the defending King fell in war",true);
 }
 }

 /* Se il difensore non ha più alcun animale vivo in nessuna fascia -> chiusura immediata senza contrattacco */
 var postD=this.getBiomeLivingStats(st,w.defIdx);

 this.concludeWar(st,w,attackerWinsThisTick,defWinFlag);
 anyConcluded=true;

 }

 /* 2. Contrattacco del difensore (qualsiasi fascia superstite, o il difensore successivo se caduto) */

 atkFighter.ind.hp-=dmgToAtk;

 st.biomi[w.atkIdx].specie[atkFighter.k].individui.splice(atkFighter.idx,1);
 w.ownAdultLosses++;
 if(atkWasKing){
 this.handleKingDeath(st,w.atkIdx,"il Re attaccante è caduto in guerra","the attacking King fell in war",true);
 }
 }
 }

 /* Se l'attaccante scende a <=1 adulto vivo -> contrattacco appena eseguito chiude subito la guerra */
 var postA=this.getBiomeLivingStats(st,w.atkIdx);
 if(postA.adults<=1){
 this.concludeWar(st,w,attackerWinsThisTick,defWinFlag);
 anyConcluded=true;

 if(attackerWinsThisTick.length>0){

 valutaCombinazioneDadi:function(tiri){
 var count=tiri.length;
 if(count===0){
 return {key:"nessuna",it:"Nessuna combinazione",en:"No combination",baseScore:CONFIG.BASE_SCORES.nessuna,w:[],isColorCombo:false};
 }
 var isFiveDice=(count===CONFIG.REGOLE.dadiTot);

 var byVal={};
 for(var i=0;i<tiri.length;i++){
 var d=tiri[i];
 if(!byVal[d.value])byVal[d.value]=[];
 byVal[d.value].push(i);
 }
 var groups=Object.keys(byVal).map(function(v){
 return {value:Number(v),indices:byVal[v]};
 }).sort(function(g1,g2){
 if(g2.indices.length!==g1.indices.length)return g2.indices.length-g1.indices.length;
 return g2.value-g1.value;
 });

 function winningGroupHasSameColor(idxs){
 if(!isFiveDice || !idxs || idxs.length===0)return false;
 var c0=tiri[idxs[0]].color;
 for(var j=1;j<idxs.length;j++){
 if(tiri[idxs[j]].color!==c0)return false;
 }
 return true;
 }

 var g0=groups[0],g1=groups[1];

 if(isFiveDice && g0 && g0.indices.length===5){
 var col5=winningGroupHasSameColor(g0.indices);
 return {
 key:col5?"pokerissimo_colore":"pokerissimo",
 it:col5?"Pokerissimo + Colore":"Pokerissimo",
 en:col5?"Five of a kind + Color":"Five of a kind",
 baseScore:col5?CONFIG.BASE_SCORES.pokerissimo_colore:CONFIG.BASE_SCORES.pokerissimo,
 w:g0.indices,
 isColorCombo:col5
 };
 }
 if(g0 && g0.indices.length===4){
 var col4=winningGroupHasSameColor(g0.indices);
 return {
 key:col4?"poker_colore":"poker",
 it:col4?"Poker + Colore":"Poker",
 en:col4?"Four of a kind + Color":"Four of a kind",
 baseScore:col4?CONFIG.BASE_SCORES.poker_colore:CONFIG.BASE_SCORES.poker,
 w:g0.indices,
 isColorCombo:col4
 };
 }
 if(g0 && g0.indices.length===3 && g1 && g1.indices.length===2){
 var fullIdxs=g0.indices.concat(g1.indices);
 var colFull=winningGroupHasSameColor(fullIdxs);
 return {
 key:colFull?"full_colore":"full",
 it:colFull?"Full + Colore":"Full",
 en:colFull?"Full house + Color":"Full house",
 baseScore:colFull?CONFIG.BASE_SCORES.full_colore:CONFIG.BASE_SCORES.full,
 w:fullIdxs,
 isColorCombo:colFull
 };
 }
 if(g0 && g0.indices.length===3){
 var col3=winningGroupHasSameColor(g0.indices);
 return {
 key:col3?"tris_colore":"tris",
 it:col3?"Tris + Colore":"Tris",
 en:col3?"Three of a kind + Color":"Three of a kind",
 baseScore:col3?CONFIG.BASE_SCORES.tris_colore:CONFIG.BASE_SCORES.tris,
 w:g0.indices,
 isColorCombo:col3
 };
 }
 if(g0 && g0.indices.length===2 && g1 && g1.indices.length===2){
 var dpIdxs=g0.indices.concat(g1.indices);
 var col2p=winningGroupHasSameColor(dpIdxs);
 return {
 key:col2p?"doppia_coppia_colore":"doppia_coppia",
 it:col2p?"Doppia coppia + Colore":"Doppia coppia",
 en:col2p?"Two pair + Color":"Two pair",
 baseScore:col2p?CONFIG.BASE_SCORES.doppia_coppia_colore:CONFIG.BASE_SCORES.doppia_coppia,
 w:dpIdxs,
 isColorCombo:col2p
 };
 }
 if(g0 && g0.indices.length===2){
 var col1p=winningGroupHasSameColor(g0.indices);
 return {
 key:col1p?"coppia_colore":"coppia",
 it:col1p?"Coppia + Colore":"Coppia",
 en:col1p?"Pair + Color":"Pair",
 baseScore:col1p?CONFIG.BASE_SCORES.coppia_colore:CONFIG.BASE_SCORES.coppia,
 w:g0.indices,
 isColorCombo:col1p
 };
 }
 if(isFiveDice && winningGroupHasSameColor([0,1,2,3,4])){
 return {
 key:"colore",
 it:"Colore",
 en:"Flush",
 baseScore:CONFIG.BASE_SCORES.colore,
 w:[0,1,2,3,4],
 isColorCombo:true
 };
 }
 return {key:"nessuna",it:"Nessuna combinazione",en:"No combination",baseScore:CONFIG.BASE_SCORES.nessuna,w:[],isColorCombo:false};
 },

 applyWheelPrize:function(st,prize){

 lanciaDadiD20:function(st,isManual,isOffline){
 var nDadi=isManual?CONFIG.REGOLE.dadiTot:this.scegliNumeroDadiFuria(st);
 st.lanci++;
 st.lastDiceCount=nDadi;
 if(isManual)st.lanciManuali=(st.lanciManuali||0)+1;

 var tiri=[];
 var sumValues=0;
 for(var i=0;i<nDadi;i++){
 var bIdx=Math.floor(this.nextRnd(st)*CONFIG.BIOMI.length);
 var aIdx=Math.floor(this.nextRnd(st)*5);
 var val=(aIdx+1);
 var color=CONFIG.CCOL[bIdx];
 sumValues+=val;
 tiri.push({b:bIdx,a:aIdx,value:val,color:color});
 }

 var missingDice=Math.max(0,CONFIG.REGOLE.dadiTot-nDadi);
 var multiplierSum=sumValues+missingDice;

 var combo=this.valutaCombinazioneDadi(tiri);
 var colorBonus=combo.isColorCombo?(1+0.15*this.getUpgLvl(st,"risonanza_bioma")):1;
 var linfaProduced=Math.round(combo.baseScore*multiplierSum*colorBonus);

 st.linfa+=linfaProduced;
 st.linfaTotale+=linfaProduced;
 st.ultimoLancio=tiri;
 st.ultimaComb={
 key:combo.key,
 it:combo.it,
 en:combo.en,
 linfaProduced:linfaProduced,
 w:combo.w
 };

 if(!st.diceAffinity)st.diceAffinity={};
 for(var m=0;m<tiri.length;m++){
 var bi=tiri[m].b;
 var ai=tiri[m].a;
 var affKey=bi+"_"+ai;
 st.diceAffinity[affKey]=Math.min(10,(st.diceAffinity[affKey]||0)+1);
 st.biomi[bi].linfaProdotta+=Math.max(1,Math.round(linfaProduced/tiri.length));
 }

 if(combo.key!=="nessuna"){
 st.stats.combinazioni=(st.stats.combinazioni||0)+1;
 if(!isOffline)AUDIO.play("combo");
 }else if(!isOffline){
 AUDIO.play("roll");
 }

 if(linfaProduced>(st.stats.migliorLancio||0)){
 st.stats.migliorLancio=linfaProduced;
 st.stats.migliorCombIt=combo.it;
 st.stats.migliorCombEn=combo.en;
 }

 this.processAutonomousBirths(st);
 if(!UI.motoRidotto())U.diceAnim=0.45;

 if(!isManual && (st.lanci%CONFIG.REGOLE.wheelTriggerEveryRolls===0)){
 this.triggerSpecialWheel(st,!!isOffline);
 }
 },

 passoTempo:function(st,dtSec,isOffline){
 if(st.specialWheel && !isOffline)return false;
 var structuralChange=false;
 st.t+=dtSec;
 for(var b=0;b<st.biomi.length;b++){
 if((st.biomi[b].fatigueRemaining||0)>0)st.biomi[b].fatigueRemaining=Math.max(0,st.biomi[b].fatigueRemaining-dtSec);
 if((st.biomi[b].forceDebuffTicks||0)>0)st.biomi[b].forceDebuffTicks=Math.max(0,st.biomi[b].forceDebuffTicks-dtSec);
 }
 this.avanzaCicloVita(st,dtSec);
 this.initiateAutonomousWars(st);
 this.stepWarsTick(st,!!isOffline);

 while(st.t>=st.prossimoCambioTemp){
 this.aggiornaTemperamentoFuria(st);
 st.prossimoCambioTemp+=CONFIG.REGOLE.temperamentoTickSec;
 structuralChange=true;
 }
 var stepSec=this.getLancioIntervalSec(st);
 while(st.t>=st.prossimoLancio){
 this.lanciaDadiD20(st,false,isOffline);
 st.prossimoLancio+=stepSec;
 structuralChange=true;
 if(st.specialWheel && !isOffline)break;
 }
 if(st.t>=st.prossimoRespiro){
 if(this.processAutonomousBirths(st)>0)structuralChange=true;
 st.prossimoRespiro+=CONFIG.REGOLE.respiroSec;
 }
 return structuralChange;
 },

 initWorldMap:function(){
 for(var y=0;y<this.MH;y++)for(var x=0;x<this.MW;x++){
 var idx=y*this.MW+x;
 var nx=(x-127.5)/114,ny=(y-79.5)/66,r2=nx*nx+ny*ny;
 var detail=Math.sin(x*0.105)*0.11+Math.cos(y*0.125)*0.11+Math.sin((x+y)*0.07)*0.07;
 var h=1.06-r2+detail;
 if(h<0.08){this.MAP_GRID[idx]=0;this.MAP_OWNER[idx]=-1;}
 else if(h<0.18){this.MAP_GRID[idx]=1;this.MAP_OWNER[idx]=-1;}
 else if(h<0.25){this.MAP_GRID[idx]=2;this.MAP_OWNER[idx]=-1;}
 else{
 this.MAP_GRID[idx]=h<0.31?3:(h>0.74?6:(h>0.56?5:4));
 var best=0,bd=1e9;
 for(var c=0;c<5;c++){
 var dx=(x-this.MAP_CENTERS[c].x)*0.95,dy=(y-this.MAP_CENTERS[c].y)*1.05;
 var d=Math.hypot(dx,dy)+Math.sin(x*0.09+c)*4.2;
 if(d<bd){bd=d;best=c;}
 }
 this.MAP_OWNER[idx]=best;
 }
 }
 },

 drawWorldMap:function(){
 var cv=document.getElementById("wb-map");if(!cv||!S)return;
 var ctx=cv.getContext("2d"),W=cv.width,H=cv.height,cw=W/this.MW,ch=H/this.MH;
 ctx.imageSmoothingEnabled=false;

 for(var y=0;y<this.MH;y++)for(var x=0;x<this.MW;x++){
 var idx=y*this.MW+x,t=this.MAP_GRID[idx],ow=this.MAP_OWNER[idx];
 if(t===0)ctx.fillStyle="#0b2242";
 else if(t===1)ctx.fillStyle="#14396b";
 else if(t===2)ctx.fillStyle="#1d548f";
 else{
 var tm=CONFIG.CTEMA[ow>=0?ow:0];
 ctx.fillStyle=t===3?tm.sand:(t===6?tm.rock:(t===5?tm.alt:tm.land));
 }
 ctx.fillRect(x*cw,y*ch,cw+0.6,ch+0.6);
 }

 ctx.fillStyle="#090d16";
 for(var y2=0;y2<this.MH;y2++)for(var x2=0;x2<this.MW;x2++){
 var idx2=y2*this.MW+x2,ow2=this.MAP_OWNER[idx2];
 if(ow2<0)continue;
 var leftOw=(x2>0)?this.MAP_OWNER[idx2-1]:-1;
 var topOw=(y2>0)?this.MAP_OWNER[idx2-this.MW]:-1;
 if(ow2===2){
 if(leftOw>=0&&leftOw!==2)ctx.fillRect(x2*cw,y2*ch,1.6,ch+0.6);
 if(topOw>=0&&topOw!==2)ctx.fillRect(x2*cw,y2*ch,cw+0.6,1.6);
 }else{
 if(leftOw>=0&&leftOw!==ow2)ctx.fillRect(x2*cw,y2*ch,1.4,ch+0.6);
 if(topOw>=0&&topOw!==ow2)ctx.fillRect(x2*cw,y2*ch,cw+0.6,1.4);
 }
 }

 /* Frecce per le guerre attive sulla mappa di Casa */
 var activeW=(S.guerre||[]).filter(function(w){return w.active;});
 for(var wi=0;wi<activeW.length;wi++){
  var wwObj=activeW[wi];
  var cA=this.MAP_CENTERS[SIM.clamp(wwObj.atkIdx,0,4)];
  var cD=this.MAP_CENTERS[SIM.clamp(wwObj.defIdx,0,4)];
  var x1=cA.x*cw,y1=cA.y*ch,x2=cD.x*cw,y2=cD.y*ch;
  var mx=(x1+x2)*0.5,my=(y1+y2)*0.5 - 24 - (wi*10);
  ctx.save();
  ctx.strokeStyle="#ef4444";
  ctx.fillStyle="#ef4444";
  ctx.lineWidth=13;
  ctx.beginPath();
  ctx.moveTo(x1,y1);
  ctx.quadraticCurveTo(mx,my,x2,y2);
  ctx.stroke();
  var ang=Math.atan2(y2-my,x2-mx);
  var hl=34;
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-hl*Math.cos(ang-0.42),y2-hl*Math.sin(ang-0.42));
  ctx.lineTo(x2-hl*Math.cos(ang+0.42),y2-hl*Math.sin(ang+0.42));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
 }

 /* Singola etichetta per bioma con 3 voci: Nome · Vivi/Cap · Adulti */
 ctx.textBaseline="middle";ctx.textAlign="center";
 for(var c=0;c<5;c++){
 var lp=this.MAP_LABELS[c];
 var lx=lp.x*cw,ly=lp.y*ch;
 var isSel=(c===U.focB);
 var bName=U.lang==="en"?CONFIG.BIOMI[c].en.N:CONFIG.BIOMI[c].it.N;
 var stB=SIM.getBiomeLivingStats(S,c);
 var capB=SIM.getBiomeMaxSlots(S,c);
 var line1=bName;
 var line2=stB.count+"/"+capB+" · "+stB.adults+"ad";
 ctx.font="900 32px 'Plus Jakarta Sans', sans-serif";
 var tw1=ctx.measureText(line1).width;
 ctx.font="800 25px 'Plus Jakarta Sans', sans-serif";
 var tw2=ctx.measureText(line2).width;
 var bw=Math.max(tw1,tw2)+32,bh=74;
 ctx.fillStyle=CONFIG.CCOL[c];
 ctx.strokeStyle=isSel?"#ffffff":"#090d16";
 ctx.lineWidth=isSel?5:3;
 ctx.beginPath();ctx.roundRect(lx-bw*0.5,ly-bh*0.5,bw,bh,12);ctx.fill();ctx.stroke();
 ctx.fillStyle=CONFIG.CLABEL_FG[c];
 ctx.font="900 32px 'Plus Jakarta Sans', sans-serif";
 ctx.fillText(line1,lx,ly-15);
 ctx.font="800 25px 'Plus Jakarta Sans', sans-serif";
 ctx.fillText(line2,lx,ly+17);
 }

 ctx.font="bold 13px 'Plus Jakarta Sans', sans-serif";
 for(var f=this.MAP_FX.length-1;f>=0;f--){
 var fx=this.MAP_FX[f];
 ctx.fillStyle="#34d399";
 ctx.fillText(fx.txt,fx.x*cw,fx.y*ch);
 this.MAP_FX.splice(f,1);
 }
 },

 drawBiomeMiniMap:function(){
 var cv=document.getElementById("bio-map");if(!cv||!S)return;
 var ctx=cv.getContext("2d"),W=cv.width,H=cv.height,b=SIM.clamp(U.focB,0,4);
 var tm=CONFIG.CTEMA[b]||CONFIG.CTEMA[0];
 var subW=192,subH=108,cw=W/subW,ch=H/subH;
 ctx.imageSmoothingEnabled=false;

 for(var y=0;y<subH;y++)for(var x=0;x<subW;x++){
 var nx=(x-subW*0.5)/(subW*0.47),ny=(y-subH*0.50)/(subH*0.44);
 var r2=nx*nx+ny*ny;
 var wave=Math.sin(x*0.09+b)*0.08+Math.cos(y*0.11-b)*0.08+Math.sin((x+y)*0.06)*0.05;
 var h=1.14-r2+wave;
 if(h<0.04)ctx.fillStyle="#0b2242";
 else if(h<0.12)ctx.fillStyle="#14396b";
 else if(h<0.19)ctx.fillStyle="#1d548f";
 else if(h<0.26)ctx.fillStyle=tm.sand;
 else if(h>0.82)ctx.fillStyle=tm.rock;
 else if(h>0.60)ctx.fillStyle=tm.alt;
 else ctx.fillStyle=tm.land;
 ctx.fillRect(x*cw,y*ch,cw+0.6,ch+0.6);
 }

 var B=S.biomi[b],meta=CONFIG.BIOMI[b];
 if(!B||!meta)return;
 var stats=SIM.getBiomeLivingStats(S,b);
 var force=SIM.getBiomeForce(S,b);
 var bNome=U.lang==="en"?meta.en.N:meta.it.N;

 ctx.imageSmoothingEnabled=true;

 /* Capitale del bioma al centro-alto dell'habitat */

 ctx.fillStyle="rgba(9,13,22,0.88)";
 ctx.strokeStyle=CONFIG.CCOL[b];
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.roundRect(capX-capW*0.5,capY+30,capW,24,8);
 ctx.fill();

 /* Disposizione visiva degli individui vivi nell'habitat */
 var phaseColors={cucciolo:"#22c55e",giovane:"#38bdf8",adulto:"#eab308",anziano:"#f97316",morente:"#ef4444"};

 /* Aggiornamento leggero a ogni tick: aggiorna header, countdown e stats senza ricostruire il DOM */
 updateTickLight:function(){
 if(!S)return;
 var pauseTag=U.vel===0?(" · "+this.tr("PAUSA","PAUSED")):"";
 var sub=document.getElementById("subtit");
 if(sub)sub.textContent=this.tr("Ciclo continuo · Lanci: ","Continuous cycle · Rolls: ")+S.lanci+" · "+Math.floor(S.t)+"s"+pauseTag;

 var bf=document.getElementById("bdg-f");if(bf)bf.textContent="💧 "+this.fmtNum(S.linfa)+" Linfa";
 var be=document.getElementById("bdg-e");if(be)be.textContent="✨ "+this.fmtNum(S.semi||0);
 var bc=document.getElementById("bdg-c");if(bc)bc.textContent="🔥 "+this.fmtNum(S.cenere||0);
 var bl=document.getElementById("bdg-life");if(bl)bl.textContent="🐾 "+SIM.contaIndividuiVivi(S)+"/"+SIM.getTotalWorldSlots(S);

 if(U.view==="home" && !S.specialWheel){
 var intervalSec=SIM.getLancioIntervalSec(S);
 var rem=Math.max(0,S.prossimoLancio-S.t);
 var pct=SIM.clamp(100*(1-rem/intervalSec),0,100);
 var secEl=document.getElementById("auto-roll-sec");
 var barEl=document.getElementById("auto-roll-bar");
 if(secEl)secEl.textContent=Math.ceil(rem)+"s";
 if(barEl)barEl.style.width=pct+"%";

 var manBtn=document.getElementById("btn-manual-roll");
 if(manBtn){
 var nowSec=Date.now()/1000;
 var coolRem=Math.max(0,Math.ceil(U.coolUntil-nowSec));
 var manCost=SIM.getManualRollCost(S);
 var canForce=S.linfa>=manCost&&coolRem<=0;
 manBtn.disabled=!canForce;
 if(coolRem>0){
 manBtn.innerHTML='<span>'+this.tr("Attendi","Wait")+'</span><b>'+coolRem+'s</b>';
 }else{
 manBtn.innerHTML='<span>'+this.tr("...lanciali tutti tu!","...roll them all yourself!")+'</span><small style="font-weight:900">'+this.fmtNum(manCost)+' '+this.tr("Linfa","Sap")+'</small>';
 }
 }

 var bioStats=SIM.getBiomeLivingStats(S,U.focB);
 var aliveEl=document.getElementById("home-bio-alive");
 var ageEl=document.getElementById("home-bio-age");
 if(aliveEl)aliveEl.textContent=bioStats.count+"/25";
 if(ageEl)ageEl.textContent=bioStats.count>0?(bioStats.avgAge+" "+this.tr("anni","yrs")):"—";
 }else if(U.view==="bioma"){
 try{this.drawBiomeMiniMap();}catch(e){}
 }else if(U.view==="guerre" && U.warSubTab==="active"){
 var wBox=document.getElementById("war-cards-container");
 if(wBox)wBox.innerHTML=this.renderWarCardsList();
 }
 },

/* ============================================================================
 * 6. ACTIONS & BOOTSTRAP LOOP
 * ============================================================================ */
function findUpgradeDef(id){
 for(var i=0;i<CONFIG.UPGRADES_ECO.length;i++)if(CONFIG.UPGRADES_ECO[i].id===id)return CONFIG.UPGRADES_ECO[i];
 for(var j=0;j<CONFIG.UPGRADES_ASH.length;j++)if(CONFIG.UPGRADES_ASH[j].id===id)return CONFIG.UPGRADES_ASH[j];
 return null;
}

function agisci(a,el){
 AUDIO.unlock();
 if(a==="go"){U.view=el.getAttribute("data-v")||"home";}
 else if(a==="selBioma"){U.focB=SIM.clamp(Number(el.getAttribute("data-b")),0,4);}
 else if(a==="warSub"){U.warSubTab=el.getAttribute("data-sub")||"active";}
 else if(a==="vel"){U.vel=Number(el.getAttribute("data-v"));}
 else if(a==="openHelp"){UI.showHelpModal();return;}
 else if(a==="lancia"){
 if(S.specialWheel)return;
 var nowSec=Date.now()/1000;
 var manCost=SIM.getManualRollCost(S);
 if(S.linfa>=manCost&&nowSec>=U.coolUntil){
 S.linfa-=manCost;
 U.coolUntil=nowSec+CONFIG.REGOLE.forzaCooldownSec;
 SIM.lanciaDadiD20(S,true,false);
 S.prossimoLancio=S.t+SIM.getLancioIntervalSec(S);
 }
 }
 else if(a==="buyUpg"){
 var id=el.getAttribute("data-id");
 var def=findUpgradeDef(id);
 if(def){
 var lvl=SIM.getUpgLvl(S,def.id);
 var cost=SIM.getUpgCost(def,lvl);
 var pool=def.currency==="cenere"?(S.cenere||0):(S.semi||0);
 if(lvl<def.max&&pool>=cost){
 if(def.currency==="cenere")S.cenere-=cost;
 else S.semi-=cost;
 if(!S.upgrades)S.upgrades={};
 S.upgrades[def.id]=lvl+1;
 AUDIO.play("buy");
 SIM.addLog(S,"Potenziato: "+def.itN+" (Lv."+(lvl+1)+").","Upgraded: "+def.enN+" (Lv."+(lvl+1)+").",true);
 }
 }
 }
 else if(a==="lang"){U.lang=U.lang==="it"?"en":"it";}
 else if(a==="audio"){
 AUDIO.enabled=!AUDIO.enabled;
 if(AUDIO.enabled)AUDIO.play("buy");
 }
 else if(a==="diceTheme"){U.diceTheme=U.diceTheme==="emoji"?"minimal":"emoji";}
 else if(a==="motion"){U.noMotion=!U.noMotion;}
 else if(a==="expSave"){
 SAVE.saveLocal();
 var box=document.getElementById("sv-box");
 if(box)box.value=JSON.stringify({v:CONFIG.SCHEMA_VERSIONE,S:S});
 UI.toast(UI.tr("Salvataggio esportato","Save exported"));
 }
 else if(a==="impSave"){
 var box2=document.getElementById("sv-box");
 try{
 var p=JSON.parse((box2&&box2.value||"").trim());
 if(p&&p.v===CONFIG.SCHEMA_VERSIONE&&p.S&&Array.isArray(p.S.biomi)&&p.S.biomi.length===5){
 S=p.S;S.specialWheel=null;SIM.trimConcludedWars(S);UI.toast(UI.tr("Salvataggio importato","Save imported"));
 }else UI.toast(UI.tr("Codice non valido","Invalid code"));
 }catch(e){UI.toast(UI.tr("Codice non valido","Invalid code"));}
 }
 else if(a==="selPrestB"){U.prestigeB=SIM.clamp(Number(el.getAttribute("data-b")),0,4);}
 else if(a==="selPrestK"){U.prestigeK=SIM.clamp(Number(el.getAttribute("data-k")),0,4);}
 else if(a==="doPrestige"){
 var nextSt=SIM.doPrestigeAddSlot(S,U.prestigeB,U.prestigeK);
 if(nextSt){
 clearTimeout(U.wheelTimer);clearTimeout(U.wheelEndTimer);clearTimeout(U.wheelClearTimer);
 S=nextSt;
 U.view="bioma";
 U.focB=U.prestigeB;
 UI.toast(UI.tr("Prestigio completato: +1 slot aggiunto!","Prestige complete: +1 slot added!"));
 }
 }
 else if(a==="electKing"){
 var bEl=SIM.clamp(Number(el.getAttribute("data-b")),0,4);
 if(SIM.electKingInBiome(S,bEl)){
 UI.toast(UI.tr("Nuovo Re eletto!","New King elected!"));
 }
 }
 else if(a==="finishWheel"){clearTimeout(U.wheelTimer);clearTimeout(U.wheelEndTimer);clearTimeout(U.wheelClearTimer);SIM.finishWheelNow(S);}
 else if(a==="reset"){
 clearTimeout(U.wheelTimer);
 clearTimeout(U.wheelEndTimer);
 S=SIM.nuovoStato();
 SIM.lanciaDadiD20(S,false,false);
 UI.toast(UI.tr("Nuovo mondo creato","New world created"));
 }
 else if(a==="closeModal"){
 var m=document.getElementById("modal");if(m){m.className="";m.innerHTML="";}
 }
 SAVE.saveLocal();
 UI.renderFull();
}

function showOfflineModal(sec,linfaDelta,semiDelta,ashDelta){
 var m=document.getElementById("modal");if(!m)return;
 m.innerHTML='<div class="mbox"><div class="frame-hd"><span>'+UI.tr("Bentornato sull'Isola","Welcome back to the Island")+'</span></div>'+
 '<div class="dim" style="margin-bottom:10px">'+
 UI.tr("Mentre eri lontano per ","While you were away for ")+'<b>'+Math.floor(sec/60)+'m '+(sec%60)+'s</b>, '+
 UI.tr("il ciclo naturale ha prodotto ","the natural cycle produced ")+'<b>+'+UI.fmtNum(linfaDelta)+' Linfa</b>'+
 (semiDelta>0?(', <b>+'+UI.fmtNum(semiDelta)+' '+UI.tr("Semi d'Eco","Echo Seeds")+'</b>'):'')+
 (ashDelta>0?(', <b>+'+UI.fmtNum(ashDelta)+' '+UI.tr("Cenere","Ash")+'</b>'):'')+'.'+
 '</div>'+
 '<button class="btn big" data-a="closeModal">'+UI.tr("Continua","Continue")+'</button></div>';

function avvia(){
 UI.initWorldMap();
 var loaded=SAVE.loadLocal();
 if(loaded){
 S=loaded;
 var now=Date.now();
 var assenzaSec=SIM.clamp(Math.floor((now-(S.lastTs||now))/1000),0,CONFIG.REGOLE.offlineMaxSec);
 if(assenzaSec>=20){
 var primaLinfa=S.linfa,primaSemi=S.semi||0,primaCenere=S.cenere||0;
 var passi=Math.floor(assenzaSec/CONFIG.REGOLE.passo);
 for(var i=0;i<passi;i++)SIM.passoTempo(S,CONFIG.REGOLE.passo,true);
 var diffL=Math.max(0,S.linfa-primaLinfa);
 var diffS=Math.max(0,(S.semi||0)-primaSemi);
 var diffC=Math.max(0,(S.cenere||0)-primaCenere);
 if(diffL>0||diffS>0||diffC>0)showOfflineModal(assenzaSec,diffL,diffS,diffC);
 }
 }else{
 S=SIM.nuovoStato();
 SIM.lanciaDadiD20(S,false,false);
 }
 UI.renderFull();

 setInterval(function(){
 if(!S||document.hidden)return;
 if(S.specialWheel&&S.specialWheel.expiresAt&&Date.now()>=S.specialWheel.expiresAt){
 clearTimeout(U.wheelTimer);clearTimeout(U.wheelEndTimer);clearTimeout(U.wheelClearTimer);
 SIM.finishWheelNow(S);SAVE.saveLocal();UI.renderFull();return;
 }
 if(U.vel<=0||S.specialWheel)return;
 var steps=U.vel===10?5:1;
 var needFull=false;
 for(var k=0;k<steps;k++){
 if(SIM.passoTempo(S,CONFIG.REGOLE.passo,false))needFull=true;
 if(S.specialWheel){needFull=true;break;}
 }
 if(needFull)UI.renderFull();
 else UI.updateTickLight();
 if(Math.floor(S.t)%15===0)SAVE.saveLocal();
 },1000);
}

var _lastActTs=0;
function handleActionEvent(e){
 var target=e.target&&e.target.nodeType===3?e.target.parentNode:e.target;
 var el=target&&target.closest?target.closest("[data-a]"):null;
 if(!el||el.disabled)return;
 var now=Date.now();
 if(now-_lastActTs<180)return;
 _lastActTs=now;
 e.preventDefault();
 agisci(el.getAttribute("data-a"),el);
}
document.addEventListener("pointerup",handleActionEvent);
document.addEventListener("click",handleActionEvent);
document.addEventListener("visibilitychange",function(){if(document.hidden)SAVE.saveLocal();});
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",avvia);else avvia();
if("serviceWorker" in navigator){
 window.addEventListener("load",function(){
 navigator.serviceWorker.register("./sw.js").catch(function(){});
 });
}
